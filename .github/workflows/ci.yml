# PR-level CI (TASK-019). Runs lint, typecheck, coverage-enabled tests (TASK-020) and build (D-006),
# split into separate steps so the PR check names which gate failed.
# Netlify still builds and deploys on its own; this workflow never deploys.
name: CI

on:
  pull_request:
  push:
    branches: [main, development]
  workflow_dispatch:

# A newer push to the same PR/branch cancels the run still in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Cache MongoDB test binary
        uses: actions/cache@v5
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:coverage

      - name: Repository integration tests
        run: npm run test:integration

      - name: Upload coverage report
        if: always() && hashFiles('coverage/**') != ''
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: warn
          retention-days: 14

      # No .env and NETLIFY unset in CI, so the env checks only validate what is set (buildChecks.ts);
      # the bundle check still scans dist/ for leaked secrets.
      - name: Build
        run: npm run build
