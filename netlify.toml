[build]
  command = "npm run build"
  publish = "dist"
  functions = "src/backend/functions"

[build.environment]
  NODE_VERSION = "24"

[functions]
  node_bundler = "esbuild"

[dev]
  command = "npm run dev -- --host 127.0.0.1"
  targetPort = 5173
  port = 8888

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
