# MongoDB replica set 1 node cho dev — transaction + change stream chạy được như production
services:
  mongo:
    image: mongo:8.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      # chỉ 127.0.0.1 — không mở DB cho cả mạng Wi-Fi
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # lần đầu rs.status() lỗi → rs.initiate() với member mongo:27017; các lần sau trả ok
      test: >
        mongosh --quiet --eval "try { rs.status().ok } catch (e) {
        rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }).ok }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 5s
    restart: unless-stopped
volumes:
  mongo-data:
