services:
  mongo:
    image: mongo:8.0
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017" # chỉ localhost — không mở ra internet
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # khởi tạo replica set 1 node nếu chưa có, rồi báo khỏe khi đã là PRIMARY
      test: >
        mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]}).ok }"
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  mongo-data:
